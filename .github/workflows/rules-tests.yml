name: Firebase rules tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install exact dependencies
        run: npm ci

      - name: Run isolated emulator tests
        run: npm test
